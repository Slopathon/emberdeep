riftlens:{n:'Rift Lens',cl:'wizard',sl:'a',cd:10,el:'arcane',d:'Open a rift at your cursor. It drags foes in for 3s, then implodes for 500%',act(r,m){const q=capd(m,640);zon('it',q.x,q.y,210,3,{c:'#c79bff',f(z,t,dt){for(const e of itn(z.x,z.y,z.r)){if(e.boss||e.tank)continue;const d=Math.hypot(z.x-e.x,z.y-e.y)||1;e.x+=(z.x-e.x)/d*Math.min(d,240*dt);e.y+=(z.y-e.y)/d*Math.min(d,240*dt)}}});later(3,()=>{if(run)explode(q.x,q.y,230,S.atk*5,'arcane')});sfx('echo');return true}},

timeslip:{n:'Timeslip Hourglass',cl:'wizard',sl:'a',cd:14,el:'arcane',mv:1,d:'Snap back to where you were 3s ago, with the health you had then',tick(dt){const I=itp();I.ht=(I.ht||0)-dt;if(I.ht<=0){I.ht=0.1;(I.h||(I.h=[])).push({x:P.x,y:P.y,hp:P.hp});if(I.h.length>30)I.h.shift()}},act(){const I=itp(),q=I.h&&I.h[0];if(!q){sfx('no');return false}fx.push({k:'blink',x0:P.x,y0:P.y,x1:q.x,y1:q.y,l:0,m:0.25,c:'#c79bff'});P.x=q.x;P.y=q.y;P.hp=Math.max(P.hp,Math.min(S.mhp,q.hp));P.ifr=Math.max(P.ifr,0.3);I.h=[];burst(P.x,P.y,24,'#c79bff',260);sfx('blink');return true}},
prismbeam:{n:'Prism Beam',cl:'wizard',sl:'a',cd:9,el:'arcane',d:'Fire a beam that follows your aim for 2s, 90% every quarter second to all in line',act(){zon('it',P.x,P.y,1,2,{c:'rgba(0,0,0,0)',f(z,t){if(!t)return;const a=itang(aimpt()),ux=Math.cos(a),uy=Math.sin(a);fx.push({k:'lance',x0:P.x,y0:P.y,x1:P.x+ux*900,y1:P.y+uy*900,l:0,m:0.25});for(const e of run.en){if(e.dead||e.hide||e.shield)continue;const dx=e.x-P.x,dy=e.y-P.y,s=dx*ux+dy*uy;if(s>0&&s<900&&Math.abs(dx*uy-dy*ux)<26+e.r)itx(e,S.atk*0.9,'arcane',{tick:true})}}});sfx('zap');return true}},
echorobe:{n:'Echoing Robe',cl:'wizard',sl:'r',d:'+10% health. Skills that do not move you cast again 1s later, once every 6s',stat(s){s.mhp=Math.round(s.mhp*1.1)},cast(k){const I=itp();if(NOAUTO.has(k)||run.t<(I.e||0))return;I.e=run.t+6;later(1,()=>{if(run&&!g.dead){txt(P.x,P.y-34,'ECHO','#c79bff',16,true);fire(k)}})}},
frostmantle:{n:'Frostweave Mantle',cl:'wizard',sl:'r',d:'+10% health. Taking a hit chills and shoves away everything close',stat(s){s.mhp=Math.round(s.mhp*1.1)},hurt(){ring(P.x,P.y,10,230,'#8fdcff',0.3);sfx('freeze');for(const e of itn(P.x,P.y,230)){chill(e,2);const d=Math.hypot(e.x-P.x,e.y-P.y)||1;if(!e.boss&&!e.tank){e.kx+=(e.x-P.x)/d*520;e.ky+=(e.y-P.y)/d*520}}}},
heatsink:{n:'Heatsink Shroud',cl:'wizard',sl:'r',d:'Hitting burning foes stores heat. At 100 the next hit is cancelled and erupts for 400%',bf(){const h=itp().h2||0;return h>0?{n:'Heat '+h,c:'#ff7b3a',i:'flame',v:h/100}:null},hit(e,d,c,o){const I=itp();if(e.st.bt>0&&!o.tick&&(I.h2||0)<100){I.h2=Math.min(100,(I.h2||0)+5);if(I.h2>=100)txt(P.x,P.y-36,'HEAT READY','#ff7b3a',16,true)}},g(){const I=itp();if((I.h2||0)<100)return false;I.h2=0;P.inv=0.4;txt(P.x,P.y-30,'ERUPT','#ff7b3a',18,true);explode(P.x,P.y,190,S.atk*4,'fire');return true}},
confluence:{n:'Ring of Confluence',cl:'wizard',sl:'n',d:'Foes that are burning and chilled at the same time take 50% more from you',m(e){return e.st.bt>0&&e.st.ch>0?1.5:1}},
ouroboros:{n:'Ouroboros Band',cl:'wizard',sl:'n',d:'Every kill takes 0.7s off all your skill cooldowns',kill(){cdall(0.7)}},
blinkstone:{n:'Blinkstone Ring',cl:'wizard',sl:'n',d:'Blink recharges twice as fast, and your next bolt after it hits 3x',stat(s){s.bcd*=0.5},blink(){itp().nb=1;txt(P.x,P.y-34,'CHARGED','#c79bff',14)},m(e,o){return itp().nb&&isb(o)?3:1},hit(e,d,c,o){if(isb(o))itp().nb=0}},
splitfeather:{n:'Splitfeather Bow',cl:'bow',sl:'w',rg:873,d:'Arrows split into 2 side arrows for 50% when they hit',atk(m){const a=itang(m);ar(a,bm(),{oh:(b,e)=>{const an=Math.atan2(b.vy,b.vx);for(const s of[-0.5,0.5])itbo(b.x,b.y,an+s,1000,0.4,b.dmg*0.5,{el:'phys',look:'arrow',r:5,np:1,hit:new Set(b.hit)})}});sfx('arrow');return true}},
longwhisper:{n:'Longwhisper',cl:'bow',sl:'w',rg:1176,d:'Arrows gain up to +150% over distance, and past 500 range they always crit',atk(m){const dm=bm();ar(itang(m),dm,{tk:b=>{const q=Math.hypot(b.x-b.ox,b.y-b.oy);b.dmg=dm*(1+1.5*Math.min(1,q/600));if(q>500)b.amb=true}}).life=1.05;sfx('arrow');return true}},
recurve:{n:'Leaping Recurve',cl:'bow',sl:'w',rg:873,d:'Arrows leap to 3 more foes, and each leap adds 25% damage',atk(m){ar(itang(m),bm(),{rc:3,oh:b=>{b.dmg*=1.47}});sfx('arrow');return true}},
thornstring:{n:'Thornstring',cl:'bow',sl:'w',rg:873,d:'-20% arrow damage. Arrows stick in foes. The 5th one rips them all out for 600%',atk(m){ar(itang(m),bm()*0.8,{oh:(b,e)=>{e.thn=(e.thn||0)+1;if(e.thn>=5&&!e.dead){e.thn=0;txt(e.x,e.y-e.r-14,'RIP','#ff4d6d',18,true);ring(e.x,e.y,8,70,'#ff4d6d',0.25);itx(e,S.atk*6,'blood')}}});sfx('arrow');return true}},
galerepeater:{n:'Gale Repeater',cl:'bow',sl:'w',rg:873,d:'Every shot is a burst of 3 quick arrows for 45% each',atk(m){const a=itang(m),dm=bm()*0.45,am=run.bwc;for(let i=0;i<3;i++)later(i*0.07,()=>{if(run&&!g.dead){bolt(a+(rnd()-0.5)*0.04,1120,0.78,dm,{el:'phys',look:'arrow',r:5,np:1,basic:1,amb:am});sfx('arrow')}});return true}},
tethershot:{n:'Tether Shot',cl:'bow',sl:'a',cd:9,el:'wind',d:'Tie up to 4 foes near your cursor together for 6s. Your hits on one deal 40% to the rest',act(r,m){const L=itn(m.x,m.y,320).slice(0,4);if(!L.length){sfx('no');return false}for(let i=0;i<L.length;i++){L[i].lnk=run.t+6;const q=L[(i+1)%L.length];fx.push({k:'arc',x0:L[i].x,y0:L[i].y,x1:q.x,y1:q.y,c:'#b6f0c8',l:0,m:0.4})}sfx('zap');return true},hit(e,d,c,o){if(!(e.lnk>run.t)||o.tick)return;for(const q of run.en)if(q!==e&&!q.dead&&q.lnk>run.t)itx(q,d*0.4,'wind',{tick:true})}},
flarearrow:{n:'Flare Arrow',cl:'bow',sl:'a',cd:10,el:'fire',d:'Light up the ground at your cursor for 5s. Foes in the light take 35% more',act(r,m){const q=capd(m,700);zon('it',q.x,q.y,200,5,{c:'#ffcf6b',f(z){for(const e of itn(z.x,z.y,z.r))e.flr=run.t+0.2}});ring(q.x,q.y,10,200,'#ffcf6b',0.3);sfx('fuse');return true},m(e){return e.flr>run.t?1.35:1}},
grapnel:{n:'Grapnel Line',cl:'bow',sl:'a',cd:7,el:'wind',mv:1,d:'Reel yourself to the foe near your cursor, or the spot itself. Your next arrow crits',act(r,m){const t=itn(m.x,m.y,260)[0],q=t?{x:t.x,y:t.y}:capd(m,560),dx=q.x-P.x,dy=q.y-P.y,d=Math.hypot(dx,dy)||1,L=Math.max(60,Math.min(620,d-(t?t.r+40:0)));P.ddx=dx/d;P.ddy=dy/d;P.dt=L/1500;P.ifr=Math.max(P.ifr,P.dt+0.1);P.ph=new Set();itp().gr=1;fx.push({k:'beam',x0:P.x,y0:P.y,x1:q.x,y1:q.y,c:'#b6f0c8',l:0,m:0.2});sfx('dash');return true},c(e,o){return itp().gr&&isb(o)?1:0},hit(e,d,c,o){if(isb(o))itp().gr=0}},
caltrops:{n:'Caltrop Spread',cl:'bow',sl:'a',cd:8,el:'steel',d:'Scatter 8 caltrops at your cursor. Each one bites for 200% and slows the first foe on it',act(r,m){const q=capd(m,640);for(let i=0;i<8;i++){const a=i*0.785+rnd()*0.3,d=30+rnd()*120;zon('it',q.x+Math.cos(a)*d,q.y+Math.sin(a)*d,16,8,{c:'#cfd8e6',f(z){const e=itn(z.x,z.y,z.r)[0];if(e){z.t=0;e.slz=2.5;itx(e,S.atk*2,'steel');burst(z.x,z.y,6,'#cfd8e6',120)}}})}sfx('swoosh');return true}},
stillhide:{n:'Stalker Hide',cl:'bow',sl:'r',d:'After 1s standing still, take 35% less damage and deal 20% more',dr(d){return P.still>1?d*0.65:d},m(){return P.still>1?1.2:1}},
tailwind:{n:'Tailwind Vest',cl:'bow',sl:'r',d:'Moving builds up to +30% speed. At full wind your next arrow hits 2x and spends it',bf(){const w=itp().w||0;return w>0.05?{n:'Tailwind',c:'#b6f0c8',i:'dash',v:w}:null},tick(dt){const I=itp();I.w=Math.hypot(P.vx,P.vy)>25?Math.min(1,(I.w||0)+dt/3):Math.max(0,(I.w||0)-dt/2);P.itsp=I.w*0.3},m(e,o){return itp().w>=1&&isb(o)?2:1},hit(e,d,c,o){if(isb(o)&&itp().w>=1)itp().w=0}},
decoycloak:{n:'Cloak of Straw',cl:'bow',sl:'r',d:'Getting hit leaves a decoy that draws foes, then bursts. Once every 8s',hurt(){const I=itp();if(run.t<(I.dc||0))return;I.dc=run.t+8;if(run.decoy)decoyend();run.decoy={x:P.x,y:P.y,t:2,m:2};txt(P.x,P.y-40,'DECOY','#b6f0c8',15,true)}},
hawkeye:{n:'Hawk Eye Ring',cl:'bow',sl:'n',d:'Perfect releases take 1.5s off every skill',hit(e,d,c,o){if(o.basic&&o.amb&&run.t>(itp().he||0)){itp().he=run.t+0.1;cdall(1.5);txt(P.x,P.y-34,'-1.5s','#ffcf6b',14)}}},
quarry:{n:'Quarry Signet',cl:'bow',sl:'n',d:'The first foe you hit is your Quarry and takes 40% more. It passes on when it dies',m(e){return itp().q===e?1.4:1},hit(e,d,c,o){const I=itp();if(!o.tick&&(!I.q||I.q.dead)){I.q=e;txt(e.x,e.y-e.r-20,'QUARRY','#ffcf6b',14,true)}},kill(e){const I=itp();if(I.q===e){const n=itn(e.x,e.y,700,o=>o!==e)[0];I.q=n||null;if(n)txt(n.x,n.y-n.r-20,'QUARRY','#ffcf6b',14,true)}}},
fletcher:{n:'Fletcher Loop',cl:'bow',sl:'n',d:'Every 5th shot also throws a free fan of 5 arrows for 60%',shot(m){const I=itp();I.fl=(I.fl||0)+1;if(I.fl%5)return;const a=itang(m);for(let i=-2;i<=2;i++)bolt(a+i*0.14,1120,0.78,S.atk*0.6,{el:'phys',look:'arrow',r:5,np:1});sfx('swoosh')}},
twinfang:{n:'Twinfang Daggers',cl:'rogue',sl:'w',rg:112,d:'Every 3rd slash cuts all the way around you for 120%',atk(m){const a=itang(m),I=itp();I.tf=(I.tf||0)+1;if(I.tf%3===0)ro(a,6.28,140,S.atk*1.2,{w:12,m:0.18});else ro(a,1.75,112,S.atk);sfx('dash');return true}},
venomkiss:{n:'Venomkiss',cl:'rogue',sl:'w',rg:112,d:'Slashes poison. Every 5th slash on a foe spreads its poison to all foes nearby',atk(m){ro(itang(m),1.75,112,S.atk*0.9,{c:'#8fd98a',fn:e=>{poison(e,S.atk*0.15);e.vk=(e.vk||0)+1;if(e.vk>=5){e.vk=0;ring(e.x,e.y,8,220,'#8fd98a',0.3);for(const o of itn(e.x,e.y,220,q=>q!==e))poison(o,(e.st.pd||0)*0.6)}}});sfx('dash');return true}},
ghostblade:{n:'Ghostblade',cl:'rogue',sl:'w',rg:396,d:'Slashes also send a ghost cut forward through everything for 50%',atk(m){const a=itang(m);ro(a,1.75,112,S.atk,{c:'#b9a8ff'});bolt(a,720,0.55,S.atk*0.5,{el:'shadow',look:'wave',r:14,pierce:99,np:1});sfx('dash');return true}},
cutthroat:{n:'Cutthroat Shiv',cl:'rogue',sl:'w',rg:112,d:'+80% damage to foes under 35% health. Normal foes under 10% just die',atk(m){ro(itang(m),1.75,112,S.atk);sfx('dash');return true},m(e){return e.hp/e.mhp<0.35?1.8:1},hit(e){if(e.hp/e.mhp<0.1&&e.hp>0&&!e.boss&&!e.tank&&!e.imm){txt(e.x,e.y-e.r-14,'CUT','#ff4d6d',16,true);kill(e)}}},
chakram:{n:'Razor Chakram',cl:'rogue',sl:'w',rg:327,d:'Throw your blade instead of slashing. It cuts on the way out and again coming back',stat(s){s.fr*=0.45},atk(m){bolt(itang(m),780,3,S.atk*1.1,{el:'phys',look:'knife',r:13,pierce:999,np:1,basic:1,bk:0.42,tk:(b,dt)=>{if(b.bk>0){b.bk-=dt;if(b.bk<=0)b.hit=new Set();return}const t=Math.atan2(P.y-b.y,P.x-b.x);b.vx=Math.cos(t)*860;b.vy=Math.sin(t)*860;if(Math.hypot(P.x-b.x,P.y-b.y)<26)b.dead=1}});sfx('swoosh');return true}},
miragestep:{n:'Mirage Step',cl:'rogue',sl:'a',cd:6,el:'shadow',mv:1,d:'Vanish to your cursor. The copy you left behind bursts for 300% a second later',act(r,m){const q=capd(m,380),ox=P.x,oy=P.y;P.x=q.x;P.y=q.y;solid(P,P.r);P.ifr=Math.max(P.ifr,0.3);fx.push({k:'blink',x0:ox,y0:oy,x1:P.x,y1:P.y,l:0,m:0.2,c:'#a58bf0'});zon('it',ox,oy,20,1,{c:'#a58bf0'});later(1,()=>{if(run)explode(ox,oy,150,S.atk*3,'shadow')});sfx('blink');return true}},
hemorrhage:{n:'Hemorrhage',cl:'rogue',sl:'a',cd:8,el:'blood',d:'Everything poisoned near you takes all its remaining poison at once, doubled',act(){let n=0;for(const e of itn(P.x,P.y,380)){if(!(e.st.pt>0)||!e.st.pd)continue;const v=e.st.pd*e.st.pt*2*2;e.st.pt=0;e.st.pd=0;ring(e.x,e.y,8,70,'#ff4d6d',0.25);itx(e,v,'blood');n++}ring(P.x,P.y,10,380,'#ff4d6d',0.3);sfx(n?'crit':'no');return true}},
chainblade:{n:'Chainblade',cl:'rogue',sl:'a',cd:7,el:'phys',d:'Throw a blade at the foe near your cursor. It leaps 6 times for 160% and gives Edge each leap',act(r,m){const t=itn(m.x,m.y,300)[0];if(!t){sfx('no');return false}itx(t,S.atk*1.6,'phys');edge(1);fx.push({k:'beam',x0:P.x,y0:P.y,x1:t.x,y1:t.y,c:'#d8ccff',l:0,m:0.15});itarc(t,6,S.atk*1.6,'#d8ccff','phys',()=>edge(1));return true}},
vanish:{n:'Vanish',cl:'rogue',sl:'a',cd:14,el:'shadow',d:'Nothing can touch you for 3s, and your next slash hits 4x',act(){P.inv=3;itp().van=1;burst(P.x,P.y,26,'#5b3fa8',220);txt(P.x,P.y-36,'VANISHED','#a58bf0',18,true);sfx('blink');return true},bf(){return itp().van?{n:'Vanished',c:'#a58bf0',i:'dagger',v:1}:null},m(e,o){return itp().van&&isb(o)?4:1},hit(e,d,c,o){if(isb(o))itp().van=0}},
shadowweave:{n:'Shadowweave Coat',cl:'rogue',sl:'r',d:'For 1.5s after a dash, 40% of hits miss you',dash(){itp().dg=run.t+1.5},g(){if(run.t<(itp().dg||0)&&rnd()<0.4){txt(P.x,P.y-24,'DODGE','#a58bf0',14);P.inv=0.2;return true}return false}},
razorhide:{n:'Razorhide',cl:'rogue',sl:'r',d:'Dashing through foes cuts them for 120% and gives Edge',tick(){if(!(P.dt>0)||!P.ph)return;for(const e of itn(P.x,P.y,30)){if(P.ph.has(e))continue;P.ph.add(e);itx(e,S.atk*1.2,'phys');edge(1)}}},
banditharness:{n:'Bandit Harness',cl:'rogue',sl:'r',d:'+15% speed. Every kill gives back a dash charge',stat(s){s.spd*=1.15},kill(){P.dch=Math.min(S.dmax,P.dch+1)}},
edgekeeper:{n:'Edgekeeper Ring',cl:'rogue',sl:'n',d:'Edge never fades, and slashes always crit at 5 or more Edge',tick(){P.edt=run.t},c(e,o){return(P.edge||0)>=5&&o.basic?1:0}},
knifeseye:{n:'Knife Eye Band',cl:'rogue',sl:'n',d:'A perfect dodge resets every skill',perfect(){for(const k in P.cd)P.cd[k]=0;txt(P.x,P.y-52,'RESET','#a58bf0',18,true)}},
widowcoil:{n:'Widow Coil',cl:'rogue',sl:'n',d:'Slashes on poisoned foes add 0.5s of poison and an extra Edge',hit(e,d,c,o){if(o.basic&&e.st.pt>0){e.st.pt=Math.min(8,e.st.pt+0.5);edge(1)}}},
sunhammer:{n:'Sunhammer Censer',cl:'priest',sl:'w',rg:812,d:'-30% bolt damage. Bolts burst on impact for 70% in an area',atk(m){hl(itang(m),S.atk*0.7,{oh:b=>{const x=b.x,y=b.y;later(0.01,()=>explode(x,y,95,S.atk*0.7,'holy'))}});sfx('shoot');return true}},
mercychain:{n:'Chain of Mercy',cl:'priest',sl:'w',rg:812,d:'Bolts jump to 2 more foes, and every hit heals you 0.5%',atk(m){hl(itang(m),S.atk,{rc:2,oh:()=>heal(S.mhp*0.005,true)});sfx('shoot');return true}},
penitent:{n:'Penitent Rod',cl:'priest',sl:'w',rg:812,d:'-20% damage. Bolts pass through 4 foes and earn Faith twice as fast',atk(m){hl(itang(m),S.atk*0.8,{pierce:4,np:1});sfx('shoot');return true},hit(e,d,c,o){if(o.basic)P.faith=Math.min(100,(P.faith||0)+5)}},
vesperbell:{n:'Vesper Bell',cl:'priest',sl:'w',rg:200,d:'No bolts. Each ring hits everything within 200 of you for 90%',atk(){ring(P.x,P.y,10,200,'#ffe9a8',0.25);for(const e of itn(P.x,P.y,200))hit(e,S.atk*0.9,{el:'holy',basic:1});sfx('zap');return true}},
soulthread:{n:'Soulthread',cl:'priest',sl:'w',rg:520,d:'Tether the foe nearest your aim. Damage climbs from 70% to 210% until you switch targets',atk(m){const I=itp(),t=itn(m.x,m.y,300)[0]||itn(P.x,P.y,520)[0];if(!t)return false;if(I.st===t)I.sr=Math.min(3,(I.sr||1)+0.2);else{I.st=t;I.sr=1}fx.push({k:'beam',x0:P.x,y0:P.y,x1:t.x,y1:t.y,c:'#ffe9a8',l:0,m:0.2});hit(t,S.atk*0.7*I.sr,{el:'holy',basic:1});return true}},
