function pauseui(){const tabs=[['game','Game'],['keys','Controls']];if(!tabs.some(t=>t[0]===ptab))ptab='game';const pane=ptab==='game'?`<div class=mlist><button class=go data-go=close>Resume</button><button class=ghost data-go=inv>Gear and powers</button><button class=ghost data-go=hideown>${SET.own?'Show my particles':'Hide my particles'}</button><button class=ghost data-go=auto>${autofire?'Auto attack off':'Auto attack on'}</button>${touch&&document.documentElement.requestFullscreen?`<button class=ghost data-go=fs>${document.fullscreenElement?'Exit fullscreen':'Fullscreen'}</button>`:''}<button class=ghost data-go=quit>Leave the run</button></div><label class=sl>Sound <input type=range id=sdr min=0 max=100 value="${SET.vol}"><b id=sdv>${SET.vol}</b></label><label class=sl>Effects <input type=range id=fxr min=0 max=100 value="${SET.fx}"><b id=fxv>${SET.fx}</b></label><label class=sl>Zoom <input type=range id=zmr min=55 max=160 value="${Math.round(zt*100)}"><b id=zmv>${Math.round(zt*100)}%</b></label>`:keyhelp();show('pause',`<div class=mh><small>${rush?`Boss rush · ${rush.n} of 10 down · ${mmss(rush.t)}`:`Floor ${g.fl}`} · ${CL[g.cl||'wizard'].n}</small><h2>Paused</h2></div><div class=tabs>${tabs.map(t=>`<button class="tab${t[0]===ptab?' on':''}" data-go="tab:${t[0]}">${t[1]}</button>`).join('')}</div><div class=pane>${pane}</div>`)}
const keyhelp=()=>touch?`<div class=keys><span>Left thumb anywhere: move</span><span>Right thumb on empty space: hold to aim and fire</span><span>Big button: dash, the way you move</span><span>Blink: tap to jump the way you move, drag to aim it</span><span>Skills: tap to hit the closest foe, drag to aim</span><span>Heart button: potion</span><span>Auto attack is on, toggle it in pause</span><span>Zoom and effects live in pause</span></div>`:`<div class=keys><span><kbd>WASD</kbd> move</span><span><kbd>Mouse</kbd> aim, hold to attack</span><span><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> skills</span><span><kbd>Space</kbd> dash</span><span><kbd>Q</kbd> <kbd>E</kbd> zoom in and out</span><span><kbd>Right click</kbd> or <kbd>Shift</kbd> blink to the cursor</span><span>Dodge a hit at the last moment for a Perfect</span><span><kbd>F</kbd> potion</span><span><kbd>T</kbd> auto attack, aims at the closest foe</span><span><kbd>Tab</kbd> gear and powers</span><span><kbd>E</kbd> use things in the Hearth</span><span><kbd>Esc</kbd> pause</span></div>`
function showdead(){if(!g||!g.dead)return;const d=g.dead;show('dead',`<div class=mh><small>Floor ${d.fl}</small><h2>Taken down by ${d.by}</h2><p>You dropped ${fmt(d.lost)} gold. You wake on floor ${d.back}, the start of this zone. Level, gear, gems and powers stay for this run.</p></div><div class=row><button class=go data-go=up>Get back up</button><button class=ghost data-go=quit2>End the run</button></div>`)}
function win(){g.winpend=1;save();sfx('legend');show('win',`<div class=mh><small>Floor 100 cleared${g.ng?' · Ascension '+g.ng:''}</small><h2>The Emberheart falls</h2><p>${fmt(g.kills)} kills, ${g.deaths} deaths, best combo ${g.bestcombo}. Go again from floor 1 with everything you built. Foes and loot both scale way up.</p></div><div class=row><button class=go data-go=ng>Go deeper: Ascension ${g.ng+1}</button><button class=ghost data-go=quit2>Back to the Hearth</button></div>`)}
function title(){enterhub()}
function go(k,b){if(k==='close'){hide();return}
if(k.startsWith('tab:')){ptab=k.slice(4);pauseui();return}
if(k==='keys'){show('keys',`<div class=mh><small>How to play</small><h2>Controls</h2></div>${keyhelp()}<div class=row><button class=go data-go=${inhub?'close':'title'}>Back</button></div>`);return}
if(k==='title'){title();return}
if(k==='cont'){hide();if(g.dead){showdead();return}if(g.winpend){win();return}if(g.camp){if(!run){recalc();startfloor()}campui();return}startfloor();return}
if(k==='quit'){if(b.dataset.sure!=='1'){b.textContent='Click again, this ends the run';b.dataset.sure='1';return}enterhub();return}
if(k==='quit2'){enterhub();return}
if(k==='hideown'){SET.own=SET.own?0:1;saveset();if(inhub)hubset();else pauseui();return}
if(k==='fshub'){const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen().then(hubset,()=>{});else d.requestFullscreen().then(hubset,()=>{});return}
if(k==='descend'){g.fl=g.camp;g.camp=0;g.note='';hide();startfloor();return}
if(k==='inv'){invui();return}
if(k==='camp'){campui();return}
if(k==='up'){const back=g.dead.back;g.dead=null;g.fl=back;hide();startfloor();return}
if(k==='ng'){g.ng++;g.winpend=0;g.fl=1;hide();startfloor();return}
if(k==='auto'){autofire=!autofire;pauseui();return}
if(k==='rush'){if(rushsaved()&&b.dataset.sure!=='1'){b.textContent='Click again, this replaces your current boss rush';b.dataset.sure='1';return}rushstart();return}
if(k==='rushgo'){hide();rushstart();return}
if(k==='rushcont'){rushresume();return}
if(k==='rushexit'||k==='rushleave'){rushexit();return}
if(k==='fs'){const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen().then(pauseui,()=>{});else d.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}pauseui()},()=>{});return}
}
const sk='emberdeep-rt-v1'
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')
function rushbest(){try{return JSON.parse(localStorage.getItem('emberdeep-rush'))||null}catch(e){return null}}
const rk='emberdeep-rush-save'
function rushsaved(){return null}
function rushprep(B){const f0=B-9,lv0=g.lv;let xp=0,gold=0,nw=0,na=0,ng2=0;recalc()
for(let f=f0;f<B;f++){g.fl=f;const z=zones[zone(f)],inz=(f-1)%10,types=z.mobs.slice(0,Math.min(z.mobs.length,2+Math.floor(inz/2))),ax=types.reduce((s,k)=>s+mt[k].xp,0)/types.length,W=Math.min(8,3+Math.floor(f/10));let n=0;for(let w=1;w<=W;w++)n+=wavesize(w);xp+=n*ax*(1+dep(f)*0.01);gold+=n*ax*0.6*fp(f)+22*fp(f)
if(rnd()<0.85){const w=mkwep(f,1);if(w.atk>g.wep.atk){g.wep=w;nw++}}if(rnd()<0.85){const w=mkarm(f,1);if(ascore(w)>ascore(g.arm)){equiparm(w);na++}}}
g.xp+=xp*S.xp;while(g.xp>=need(g.lv)){g.xp-=need(g.lv);g.lv++;g.pend++}g.gold+=gold*S.gold;g.pots=9+mu('pot');g.fl=B-1;g.camp=B;g.cb={};recalc()
g.note=`Supplies from floors ${f0} to ${B-1}: ${g.lv-lv0} levels, ${fmt(gold*S.gold)} gold,${nw?', a better weapon':''}${na?', better armor':''}. Your power picks come up when the fight starts.`}
function rushstart(){rush={};rush.n=0;rush.t=0;g=fresh(SET.cl||'wizard');rushprep(10);save();campui()}
function rushresume(){const r=rushsaved();if(!r)return;if(!rush){save();rush={main:g?JSON.stringify(g):null}}rush.n=r.n||0;rush.t=r.t||0;g=r.g;g.dead=null;recalc();if(!run)startfloor();go('cont',{dataset:{}})}
function rushend(won){const r=rush,b=rushbest(),better=!b||r.n>b.n||(r.n===b.n&&r.t<b.t);if(better)try{localStorage.setItem('emberdeep-rush',JSON.stringify({n:r.n,t:r.t}))}catch(e){}try{localStorage.removeItem(rk)}catch(e){}sfx(won?'legend':'no');const d=g.dead
show('rush',`<div class=mh><small>Boss rush${g.ng?' · Ascension '+g.ng:''}</small><h2>${won?'Every boss down':'Taken down by '+d.by}</h2><p>${r.n} of 10 bosses in ${mmss(r.t)} of fight time.${better?' New best.':b?` Best is ${b.n} of 10 in ${mmss(b.t)}.`:''} </p></div><div class=row><button class=go data-go=rushgo>New boss rush</button><button class=ghost data-go=rushexit>Back to the Hearth</button></div>`)}
function rushexit(){enterhub()}
function migrate(n){if((n.v||0)<3){const d=Math.max(0,(n.fl||1)-1)+(n.ng||0)*50,f=Math.pow(1.1,d),m=f*2.3;if(n.wep.atk>4*m)n.wep.atk=Math.round(4*m);if(n.arm.def>3*m)n.arm.def=Math.round(3*m);if(n.arm.hp>8*m)n.arm.hp=Math.round(8*m);n.cb={};n.v=3}if(n.v<4){const o=n.ng||0;if(o){const cv=f=>((f-1)+o*50)%100+1;n.ng=Math.floor(((n.fl-1)+o*50)/100);n.fl=cv(n.fl);if(n.camp)n.camp=cv(n.camp);if(n.dead){n.dead.back=cv(n.dead.back);n.dead.fl=cv(n.dead.fl)}n.best=Math.max(n.best||1,n.fl)}n.v=4}return n}
function save(){}
function resize(){hzoom=1;vgc=null;spc.clear();dpr=Math.min(1.5,window.devicePixelRatio||1);vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr;cv.style.width=vw+'px';cv.style.height=vh+'px';const c=getComputedStyle($('#sa'));sa={l:parseFloat(c.paddingLeft)||0,r:parseFloat(c.paddingRight)||0,t:parseFloat(c.paddingTop)||0,b:parseFloat(c.paddingBottom)||0};tlay()}
function frame(now){fpc++;if(now-fpt>=500){fps=Math.round(fpc*1000/(now-fpt));fpc=0;fpt=now}const dt=Math.min(0.033,(now-last)/1000);last=now;sn=0
if(inhub){if(!ovk){updhub(dt);anim(dt)}drawhub(dt,now);if(ovk==='ward')drawward(now);requestAnimationFrame(frame);return}if(g&&run){let sc=1;if(slow>0&&!ovk){slow-=dt;sc=0.35}if(!ovk&&!g.dead){update(dt*sc);if(rush)rush.t+=dt}else if(g.dead&&!ovk)update(dt*0.15);if(!ovk&&!g.dead&&g.gemc)gemui();if(!ovk&&!g.dead&&g.pend>0)levelui();if(!ovk)anim(dt*sc)}
draw(dt,now);requestAnimationFrame(frame)}
addEventListener('resize',resize)
addEventListener('keydown',e=>{const k=e.key.toLowerCase();au();if(inhub)musicon();if(k==='tab'||k===' ')e.preventDefault();if(e.repeat&&key[k])return;key[k]=true
if(ovk){if(ovk==='level'&&k>='1'&&k<='3'){const b=$('#box').querySelectorAll('[data-c]')[+k-1];if(b)b.click()}else if(k==='enter'){const b=$('#box .go');if(b)b.click()}else if((k==='escape'&&(ovk==='pause'||ovk==='inv'||ovk==='hubset'||ovk==='ward'||(inhub&&ovk==='keys')))||(k==='tab'&&ovk==='inv')){if(ovk==='inv'&&g.camp)campui();else hide()}return}
if(inhub){if(k==='e'||k==='enter'||k===' ')hubuse();if(k==='escape')hubset();if(k==='m'){mute=!mute;musset()}return}if(!g||!run||g.dead)return
if(k==='q'||k==='e'){zt=k==='q'?Math.min(1.6,zt*1.12):Math.max(0.55,zt/1.12);SET.zt=zt;saveset();return}
const i=keysk.indexOf(k);if(i>=0){cast(i);return}
if(k===' '){dodge();return}
if(k==='shift'){blink();return}
if(k==='f'){potion();return}
if(k==='t'){autofire=!autofire;showbanner(autofire?'Auto attack on':'Auto attack off','',autofire?'#ffcf6b':'#958da3');banner.l=1.6;return}
if(k==='tab'||k==='i'){invui();return}
if(k==='escape'||k==='p'){pauseui();return}
if(k==='m'){mute=!mute;musset()}})
addEventListener('keyup',e=>{key[e.key.toLowerCase()]=false})
addEventListener('blur',()=>{for(const k in key)key[k]=false;mouse.down=false;if(g&&run&&!ovk&&!g.dead)pauseui()})
cv.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY})
cv.addEventListener('mousedown',e=>{au();if(inhub){musicon();if(!ovk&&hub.near)hubuse();return}mouse.x=e.clientX;mouse.y=e.clientY;if(e.button===0)mouse.down=true;if(e.button===2&&g&&run&&!ovk&&!g.dead)blink()})
addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false})
cv.addEventListener('contextmenu',e=>e.preventDefault())
cv.addEventListener('touchstart',tstart,{passive:false})
cv.addEventListener('touchmove',tmove,{passive:false})
cv.addEventListener('touchend',e=>tend(e,true),{passive:false})
cv.addEventListener('touchcancel',e=>tend(e,false),{passive:false})
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&touch&&(Math.abs(e.movementX)+Math.abs(e.movementY))>2){touch=false;ts.mv=ts.am=ts.bt=null}})
addEventListener('touchstart',()=>{if(!touch){touch=true;autofire=true}},{passive:true})
addEventListener('orientationchange',()=>setTimeout(resize,200))
$('#ov').addEventListener('input',e=>{if(e.target.type==='range')slfill(e.target);if(e.target.id==='sdr'){SET.vol=+e.target.value;$('#sdv').textContent=SET.vol;mute=SET.vol<=0;if(masterg)masterg.gain.value=SET.vol/100;saveset();musset();sfx('coin')}if(e.target.id==='fxr'){SET.fx=+e.target.value;fxm=SET.fx/100;$('#fxv').textContent=SET.fx;saveset()}if(e.target.id==='mur'){SET.mus=+e.target.value;$('#muv').textContent=SET.mus;saveset();musset()}if(e.target.id==='zmr'){zt=+e.target.value/100;SET.zt=zt;$('#zmv').textContent=e.target.value+'%';saveset()}})
$('#ov').addEventListener('click',e=>{au();const b=e.target.closest('button');if(!b||b.disabled)return;if(touch&&ovk==='level'&&performance.now()-shown<450)return;if(b.dataset.cos){const[k,v]=b.dataset.cos.split(':'),C=cos();C[k]=typeof CDEF[k]==='number'?+v:v;saveset();sfx('pick');wardui();return}if(b.dataset.gem!==undefined){gemtake(b.dataset.gem);return}if(b.dataset.gsw){const R=g.relics;R[R.indexOf(b.dataset.gsw)]=b.dataset.gk;gemdone(b.dataset.gk);return}if(b.dataset.c)choose(b.dataset.c);else if(b.dataset.buy)buy(b.dataset.buy);else if(b.dataset.max)buy(b.dataset.max,1);else if(b.dataset.go)go(b.dataset.go,b);else if(b.dataset.s!==undefined)unsock(+b.dataset.s);else if(b.dataset.b)sockgroup(b.dataset.b)})
resize()
try{const r=localStorage.getItem('emberdeep-meta');if(r){const m=JSON.parse(r);if(m&&m.up)M=m}}catch(e){}
try{const r=localStorage.getItem('emberdeep-set');if(r)Object.assign(SET,JSON.parse(r))}catch(e){}
if(touch){autofire=true;if(!SET.tz){SET.tz=1;SET.zt=0.75;saveset()}}
fxm=SET.fx/100;zm=zt=SET.zt||1
SET.cl=CL[SET.cl]?SET.cl:'wizard';mute=SET.vol<=0;title();requestAnimationFrame(frame)
})()
</script>
