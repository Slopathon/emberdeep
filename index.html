<style>
:root{--f1:#243026;--f2:#28362a;--wl:#111712;--ob:#33463a;--wt:#5d8463;--ac:#9be38a;--ink:#120d16;--fg:#fff4e2;--mut:#cfc4d6;--ember:#ff8a3d;--gold:#ffcc4d;--warm:#ffb52e;--bone:#efe2bf;--pl:#1a1320;--pl2:#241b2b;--pl3:#33273c;--well:#120c16;--hl:rgba(255,246,230,.1);--lit:inset 0 2px 0 rgba(255,246,230,.09);--dim:inset 0 -4px 0 rgba(8,5,12,.38);--disp:'Lilita One',system-ui,sans-serif;--body:'Fredoka',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0c0810;color:var(--fg);font:500 15px/1.35 var(--body);font-variant-ligatures:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;display:block;cursor:none;touch-action:none}
#sa{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);visibility:hidden;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#dwait{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);z-index:6;display:none;padding:6px 14px;border-radius:12px;background:var(--pl2);border:3px solid var(--ink);box-shadow:var(--lit),0 3px 0 var(--ink);color:var(--gold);font:600 14px Fredoka,sans-serif;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
#ov{position:fixed;inset:0;z-index:5;background:rgba(10,6,14,.72);display:flex;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#ov.sc{background:transparent}
#ov[hidden]{display:none}
#box::after{content:'';position:sticky;bottom:0;flex:none;height:24px;margin:-16px 0 -24px;background:linear-gradient(transparent,var(--pl));pointer-events:none;border-radius:0 0 18px 18px}
#box{position:relative;margin:auto;width:min(860px,100%);background:var(--pl);border:4px solid var(--ink);border-radius:24px;box-shadow:inset 0 0 0 2px var(--hl),inset 0 0 0 5px color-mix(in srgb,var(--ac) 22%,var(--pl)),inset 0 -8px 0 5px rgba(8,5,12,.3),0 10px 0 var(--ink),0 22px 44px rgba(0,0,0,.5);padding:24px;display:flex;flex-direction:column;gap:16px;animation:pop .2s cubic-bezier(.3,1.5,.6,1)}
#box::before{content:'';position:absolute;left:28px;right:28px;top:9px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(255,181,46,.5) 30%,rgba(255,181,46,.5) 70%,transparent);pointer-events:none}
@keyframes pop{from{transform:scale(.9) translateY(10px);opacity:0}}
.mh small{display:inline-block;font:15px var(--disp);letter-spacing:.04em;background:var(--warm);color:var(--ink);padding:3px 12px 4px;border-radius:99px;border:3px solid var(--ink);box-shadow:inset 0 2px 0 rgba(255,250,225,.55),inset 0 -3px 0 rgba(120,60,10,.3),0 3px 0 var(--ink)}
.mh h2{margin:10px 0 0;font:42px/1.02 var(--disp);color:var(--fg);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.mh p{margin:9px 0 0;color:var(--mut);max-width:62ch}
.ic{display:block;width:100%;height:100%;overflow:visible;--ic:var(--c,var(--gold))}
.ic .icb{fill:var(--ic)}.ic .icl{fill:color-mix(in srgb,var(--ic) 55%,#fffbe8)}.ic .ics{fill:color-mix(in srgb,var(--ic) 60%,#1b1320)}.ic .ick{fill:none;stroke:var(--ink);stroke-width:2.3;stroke-linejoin:round;stroke-linecap:round}
.ic .ln{fill:none;stroke:rgba(27,19,32,.6);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.ic .ici{fill:var(--ink)}.ic .icd{--icd:color-mix(in srgb,var(--ic) 68%,#1b1320)}.ic .icd .icb{fill:var(--icd)}.ic .icd .icl{fill:color-mix(in srgb,var(--icd) 55%,#fffbe8)}.ic .icd .ics{fill:color-mix(in srgb,var(--icd) 60%,#1b1320)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:4px}
.cardb{position:relative;text-align:left;padding:0;background:var(--pl2);border:4px solid var(--ink);border-radius:20px;box-shadow:inset 0 0 0 2px var(--hl),inset 0 -6px 0 rgba(8,5,12,.3),0 7px 0 var(--ink);display:flex;flex-direction:column;overflow:hidden;transition:transform .12s;animation:deal .32s cubic-bezier(.3,1.4,.6,1) backwards}
.cardb:nth-child(1){transform:rotate(-1.4deg)}
.cardb:nth-child(2){animation-delay:.06s;transform:translateY(-4px)}
.cardb:nth-child(3){animation-delay:.12s;transform:rotate(1.4deg)}
@keyframes deal{from{transform:translateY(46px) rotate(-7deg);opacity:0}}
.cardb:hover{transform:translateY(-9px) rotate(0);box-shadow:inset 0 0 0 2px var(--hl),0 7px 0 var(--ink),0 0 0 3px var(--warm)}
.cardb:active{transform:translateY(2px)}
.top{position:relative;display:grid;place-items:center;height:104px;background:radial-gradient(circle at 50% 50%,rgba(255,251,232,.4),transparent 60%),repeating-linear-gradient(135deg,rgba(27,19,32,.08) 0 7px,transparent 7px 14px),var(--c);border-bottom:4px solid var(--ink);box-shadow:inset 0 -14px 0 rgba(27,19,32,.2),inset 0 3px 0 rgba(255,255,255,.35)}
.top::before{content:'';position:absolute;inset:0;margin:auto;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 50% 34%,color-mix(in srgb,var(--c) 80%,#1b1320),color-mix(in srgb,var(--c) 58%,#1b1320) 74%);border:3px solid var(--ink);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 55%,#fffbe8),inset 0 -6px 0 rgba(8,5,12,.25),0 4px 0 rgba(27,19,32,.3)}
.top .ic{position:relative;width:60px;height:60px;--ic:color-mix(in srgb,var(--c) 18%,#fff4e2)}
.ck{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--fg);font:15px var(--disp);box-shadow:inset 0 0 0 2px rgba(255,246,230,.16)}
.sy{position:absolute;top:9px;right:8px;font:13px var(--disp);background:var(--ink);color:var(--c);padding:3px 9px;border-radius:99px}
.cb{flex:1;display:flex;flex-direction:column;gap:6px;padding:12px 14px 15px}
.cb>b{font:25px/1.05 var(--disp);font-weight:400;color:var(--fg);text-shadow:0 2px 0 var(--ink)}
.cb em{font-style:normal;font-size:13px;font-weight:600;color:var(--c);filter:brightness(1.2)}
.cty{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#fffbe8)}
.cty .ic{width:17px;height:17px;flex:none}
.crk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 0 6px;border-bottom:2px solid rgba(255,246,230,.08)}
.crk .pips{gap:4px}.crk .pips i{width:13px;height:13px}
.crk .pips i.nx{background:var(--fg);box-shadow:0 0 0 2px var(--c),0 0 10px var(--c);animation:nx .8s ease-in-out infinite alternate}
@keyframes nx{to{box-shadow:0 0 0 2px var(--c),0 0 2px var(--c)}}
.cbar{width:96px;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--c) var(--a),var(--fg) var(--a) var(--b),var(--ink) var(--b));box-shadow:inset 0 0 0 1.5px rgba(255,246,230,.14)}
.dsc{font-size:15px;line-height:1.3;color:color-mix(in srgb,var(--fg) 84%,var(--pl2))}
.dsc b{font-weight:700;color:var(--fg)}
.dsc b.up{color:var(--fg);background:color-mix(in srgb,var(--c) 30%,transparent);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--c) 60%,transparent);border-radius:5px;padding:0 3px}
.dsc s{opacity:.55;font-size:.86em;margin-right:3px}
.cb>i{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-style:normal;font-size:13px;font-weight:600;color:var(--c)}
.cb>i span{display:inline-flex;align-items:center;gap:4px}.cb>i .ic{width:19px;height:19px}
.cardb.syn{border-color:var(--ink);box-shadow:0 7px 0 var(--ink),0 0 0 3px var(--c)}
.cardb.rare{box-shadow:inset 0 0 0 2px var(--hl),0 7px 0 var(--ink),0 0 0 3px var(--gold)}

.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.sh{display:grid;grid-template-columns:46px minmax(0,1fr);column-gap:11px;align-items:center;text-align:left;width:100%;background:var(--pl2);border:3px solid var(--ink);border-radius:15px;box-shadow:var(--lit),var(--dim),0 4px 0 var(--ink);padding:9px 11px}
.sh .ico{width:46px;height:46px;grid-row:span 2;padding:3px;border-radius:13px;background:var(--well);box-shadow:inset 0 0 0 2px var(--hl)}
.sh:not(:disabled):hover{background:var(--pl3);box-shadow:var(--lit),var(--dim),0 4px 0 var(--ink),0 0 0 3px var(--warm)}
.sh:not(:disabled):active{transform:translateY(3px);box-shadow:var(--lit),0 1px 0 var(--ink)}
.sh:disabled{opacity:.5;cursor:default;box-shadow:none;transform:translateY(3px)}
.sht{display:flex;flex-direction:column;min-width:0}
.sh b{font:18px/1.1 var(--disp);font-weight:400}
.sht span{font-size:13px;line-height:1.2;color:var(--mut)}
.sh em{font:16px var(--disp);font-style:normal;color:var(--gold);grid-column:2}
.shc{display:flex;gap:6px;align-items:stretch}
.shc .sh{flex:1;min-width:0}
.mx{background:var(--warm);color:var(--ink);border:3px solid var(--ink);border-radius:15px;box-shadow:inset 0 2px 0 rgba(255,250,225,.55),inset 0 -4px 0 rgba(120,60,10,.3),0 4px 0 var(--ink);padding:0 9px;font:14px var(--disp)}
.mx:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.mx:disabled{opacity:.4;cursor:default;box-shadow:none;transform:translateY(3px)}
.sl{display:grid;grid-template-columns:minmax(0,150px) 1fr 52px;align-items:center;gap:10px;font:16px var(--disp);color:var(--fg)}
.sl input{width:100%;accent-color:var(--ember)}
.sl b{font:16px var(--disp);text-align:right}
.go{background:var(--ember);color:var(--ink);border:4px solid var(--ink);border-radius:16px;padding:12px 20px;font:21px var(--disp);box-shadow:inset 0 3px 0 rgba(255,236,200,.55),inset 0 -6px 0 rgba(140,50,10,.32),0 6px 0 var(--ink)}
.go:hover{background:#ffa25f}
.ghost{background:var(--pl2);color:var(--fg);border:3px solid var(--ink);border-radius:14px;padding:10px 16px;font:17px var(--disp);box-shadow:var(--lit),var(--dim),0 4px 0 var(--ink)}
.ghost:hover{background:var(--pl3);color:var(--bone)}
.go:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,236,200,.4),0 2px 0 var(--ink)}
.ghost:active{transform:translateY(3px);box-shadow:var(--lit),0 1px 0 var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.go,.row>.ghost{flex:1 1 auto}
.goldline{display:flex;align-items:center;gap:8px;font:27px var(--disp);color:var(--gold);text-shadow:0 3px 0 var(--ink)}
.goldline .ico{width:30px;height:30px}
.note{margin:0;color:var(--gold);font-size:14px;font-weight:600}
.mut{color:var(--mut);margin:0;font-size:14px}
.bx-title{background:none!important;border:0!important;box-shadow:none!important;padding:0!important;width:min(440px,100%)!important;gap:11px!important}#box.bx-title::before{display:none}
.title{display:flex;flex-direction:column;gap:12px}
.title h1{font:clamp(66px,8.4vw,104px)/.92 var(--disp);margin:0 0 2px;color:var(--ember);-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink)}
.title p{margin:0 0 6px;color:var(--fg);font-size:16px;font-weight:600;text-shadow:0 2px 0 var(--ink)}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px 16px;font-size:14px;color:var(--fg)}
kbd{display:inline-block;font:13px var(--disp);background:var(--bone);border:2px solid var(--ink);border-bottom-width:4px;border-radius:7px;padding:0 6px;color:var(--ink);box-shadow:inset 0 1px 0 #fffbe8}.kbl{display:grid;gap:6px;max-height:min(50vh,430px);overflow:auto;padding:2px 6px 2px 0}.kbr{display:grid;grid-template-columns:1fr 110px 110px;gap:8px;align-items:center;font-size:14px;color:var(--fg)}.kbk{font:13px var(--disp);background:var(--fg);color:var(--ink);border:2px solid var(--ink);border-bottom-width:4px;border-radius:7px;padding:4px 6px;min-height:32px}.kbk.on{background:#ffcf6b}.kbk.no{opacity:.55}
.inv{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}
.inv section{display:flex;flex-direction:column;gap:9px;min-width:0}
h3{margin:4px 0 0;font:20px/1 var(--disp);color:var(--warm);text-shadow:0 2px 0 var(--ink);display:flex;align-items:center;gap:10px}h3::after{content:'';flex:1;height:3px;border-radius:2px;background:var(--hl)}
h4{margin:5px 0 0;font:17px/1 var(--disp);color:var(--fg);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h4 small{font:500 12px var(--body);color:var(--mut)}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;background:var(--pl2);border:3px solid var(--ink);border-radius:13px;box-shadow:var(--lit),var(--dim);padding:7px 11px 9px}
.it small{grid-column:1/3;color:var(--mut);font-size:12px;font-weight:600}
.it b{font:18px var(--disp);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it span{font:15px var(--disp);color:var(--fg)}
.socks{display:flex;gap:7px;flex-wrap:wrap}
.sock{width:50px;height:50px;border-radius:50%;background:var(--well);border:4px solid #3e3048;box-shadow:inset 0 3px 0 rgba(0,0,0,.4),0 3px 0 var(--ink);display:grid;place-items:center;padding:0}
.sock:has(.gm){background:var(--pl3)}
.sock:hover{border-color:var(--warm)}
.gm{position:relative;display:inline-block;width:32px;height:32px;flex:none}
.gm i{position:absolute;inset:0;display:grid;place-items:center;padding-top:5px;font:14px/1 var(--disp);color:var(--ink);font-style:normal}
.gsum{display:flex;flex-direction:column;gap:2px;font-size:14px;font-weight:600}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:6px}
.bg{display:flex;align-items:center;gap:6px;text-align:left;background:var(--pl2);border:3px solid var(--ink);border-radius:12px;box-shadow:var(--lit);padding:3px 8px 3px 4px;font-size:12.5px;font-weight:600;line-height:1.1;min-width:0}
.bg:hover{background:var(--pl3)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nums div{background:var(--well);border:3px solid var(--ink);border-radius:13px;box-shadow:inset 0 0 0 2px var(--hl);padding:6px 9px;min-width:0}
.nums small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.nums b{font:22px/1.1 var(--disp);color:var(--bone)}
.ab{display:grid;grid-template-columns:40px minmax(0,1fr);gap:0 9px;align-items:start;background:var(--pl2);border:3px solid var(--ink);border-radius:13px;box-shadow:inset 4px 0 0 var(--c,var(--warm)),var(--lit),var(--dim);padding:7px 10px 9px 13px}
.ab .ico{box-sizing:border-box;width:40px;height:40px;grid-row:span 2;padding:4px;border-radius:50%;border:2px solid var(--ink);background:radial-gradient(circle at 50% 34%,color-mix(in srgb,var(--c) 80%,#1b1320),color-mix(in srgb,var(--c) 56%,#1b1320) 74%);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 55%,#fffbe8);--ic:color-mix(in srgb,var(--c) 18%,#fff4e2)}
.ab div{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ab b{font:17px/1.1 var(--disp)}
.ab p{margin:1px 0 0;font-size:13px;line-height:1.22;color:var(--mut)}
.pips{display:inline-flex;gap:3px;flex:none}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(255,246,230,.14)}
.pips i.on{background:var(--c,var(--ember));box-shadow:inset 0 -2px 0 rgba(27,19,32,.3)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--well);color:var(--mut);border:3px solid var(--ink);border-radius:12px;padding:7px 14px;font:16px var(--disp);box-shadow:inset 0 0 0 2px var(--hl)}
.tab.on{background:var(--warm);color:var(--ink);box-shadow:inset 0 2px 0 rgba(255,250,225,.55),inset 0 -4px 0 rgba(120,60,10,.3),0 3px 0 var(--ink)}
.pane{display:flex;flex-direction:column;gap:12px;min-height:214px}
.st{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;margin:6px 0 12px;color:var(--fg);background:var(--well);border:3px solid var(--ink);border-radius:13px;overflow:hidden}.st th,.st td{padding:5px 8px;text-align:right;white-space:nowrap}.st th{font:13px var(--disp);letter-spacing:.03em;color:var(--warm);background:var(--pl2)}.st th:first-child,.st td:first-child{text-align:left}.st tr+tr td{border-top:1px solid rgba(255,246,230,.07)}.st tr:nth-child(odd) td{background:rgba(255,246,230,.025)}.stw{overflow-x:auto}.mlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
