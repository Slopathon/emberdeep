confluence:{n:'Ring of Confluence',cl:'wizard',sl:'n',d:'Foes that are burning and chilled at the same time take 50% more from you',m(e){return e.st.bt>0&&e.st.ch>0?1.5:1}},

splitfeather:{n:'Splitfeather Bow',cl:'bow',sl:'w',d:'Arrows split into 2 side arrows for 50% when they hit',atk(m){const a=itang(m);ar(a,bm(),{oh:(b,e)=>{const an=Math.atan2(b.vy,b.vx);for(const s of[-0.5,0.5])itbo(b.x,b.y,an+s,1000,0.4,b.dmg*0.5,{el:'phys',look:'arrow',r:5,np:1,hit:new Set(b.hit)})}});sfx('shoot');return true}},
longwhisper:{n:'Longwhisper',cl:'bow',sl:'w',d:'Arrows gain up to +150% over distance, and past 500 range they always crit',atk(m){const dm=bm();ar(itang(m),dm,{tk:b=>{const q=Math.hypot(b.x-b.ox,b.y-b.oy);b.dmg=dm*(1+1.5*Math.min(1,q/600));if(q>500)b.amb=true}}).life=1.05;sfx('shoot');return true}},

galerepeater:{n:'Gale Repeater',cl:'bow',sl:'w',d:'Every shot is a burst of 3 quick arrows for 45% each',atk(m){const a=itang(m),dm=bm()*0.45,am=run.bwc;for(let i=0;i<3;i++)later(i*0.07,()=>{if(run&&!g.dead){bolt(a+(rnd()-0.5)*0.04,1120,0.78,dm,{el:'phys',look:'arrow',r:5,np:1,basic:1,amb:am});sfx('shoot')}});return true}},
tethershot:{n:'Tether Shot',cl:'bow',sl:'a',cd:9,el:'wind',d:'Tie up to 4 foes near your cursor together for 6s. Your hits on one deal 40% to the rest',act(r,m){const L=itn(m.x,m.y,320).slice(0,4);if(!L.length){sfx('no');return false}for(let i=0;i<L.length;i++){L[i].lnk=run.t+6;const q=L[(i+1)%L.length];fx.push({k:'arc',x0:L[i].x,y0:L[i].y,x1:q.x,y1:q.y,c:'#b6f0c8',l:0,m:0.4})}sfx('zap');return true},hit(e,d,c,o){if(!(e.lnk>run.t)||o.tick)return;for(const q of run.en)if(q!==e&&!q.dead&&q.lnk>run.t)itx(q,d*0.4,'wind',{tick:true})}},

grapnel:{n:'Grapnel Line',cl:'bow',sl:'a',cd:7,el:'wind',mv:1,d:'Reel yourself to the foe near your cursor, or the spot itself. Your next arrow crits',act(r,m){const t=itn(m.x,m.y,260)[0],q=t?{x:t.x,y:t.y}:capd(m,560),dx=q.x-P.x,dy=q.y-P.y,d=Math.hypot(dx,dy)||1,L=Math.max(60,Math.min(620,d-(t?t.r+40:0)));P.ddx=dx/d;P.ddy=dy/d;P.dt=L/1500;P.ifr=Math.max(P.ifr,P.dt+0.1);P.ph=new Set();itp().gr=1;fx.push({k:'beam',x0:P.x,y0:P.y,x1:q.x,y1:q.y,c:'#b6f0c8',l:0,m:0.2});sfx('dash');return true},c(e,o){return itp().gr&&isb(o)?1:0},hit(e,d,c,o){if(isb(o))itp().gr=0}},
caltrops:{n:'Caltrop Spread',cl:'bow',sl:'a',cd:8,el:'steel',d:'Scatter 8 caltrops at your cursor. Each one bites for 200% and slows the first foe on it',act(r,m){const q=capd(m,640);for(let i=0;i<8;i++){const a=i*0.785+rnd()*0.3,d=30+rnd()*120;zon('it',q.x+Math.cos(a)*d,q.y+Math.sin(a)*d,16,8,{c:'#cfd8e6',f(z){const e=itn(z.x,z.y,z.r)[0];if(e){z.t=0;e.slz=2.5;itx(e,S.atk*2,'steel');burst(z.x,z.y,6,'#cfd8e6',120)}}})}sfx('swoosh');return true}},
stillhide:{n:'Stalker Hide',cl:'bow',sl:'r',d:'After 1s standing still, take 35% less damage and deal 20% more',dr(d){return P.still>1?d*0.65:d},m(){return P.still>1?1.2:1}},
tailwind:{n:'Tailwind Vest',cl:'bow',sl:'r',d:'Moving builds up to +30% speed. At full wind your next arrow hits 2x and spends it',bf(){const w=itp().w||0;return w>0.05?{n:'Tailwind',c:'#b6f0c8',i:'dash',v:w}:null},tick(dt){const I=itp();I.w=Math.hypot(P.vx,P.vy)>25?Math.min(1,(I.w||0)+dt/3):Math.max(0,(I.w||0)-dt/2);P.itsp=I.w*0.3},m(e,o){return itp().w>=1&&isb(o)?2:1},hit(e,d,c,o){if(isb(o)&&itp().w>=1)itp().w=0}},

quarry:{n:'Quarry Signet',cl:'bow',sl:'n',d:'The first foe you hit is your Quarry and takes 40% more. It passes on when it dies',m(e){return itp().q===e?1.4:1},hit(e,d,c,o){const I=itp();if(!o.tick&&(!I.q||I.q.dead)){I.q=e;txt(e.x,e.y-e.r-20,'QUARRY','#ffcf6b',14,true)}},kill(e){const I=itp();if(I.q===e){const n=itn(e.x,e.y,700,o=>o!==e)[0];I.q=n||null;if(n)txt(n.x,n.y-n.r-20,'QUARRY','#ffcf6b',14,true)}}},
fletcher:{n:'Fletcher Loop',cl:'bow',sl:'n',d:'Every 5th shot also throws a free fan of 5 arrows for 60%',shot(m){const I=itp();I.fl=(I.fl||0)+1;if(I.fl%5)return;const a=itang(m);for(let i=-2;i<=2;i++)bolt(a+i*0.14,1120,0.78,S.atk*0.6,{el:'phys',look:'arrow',r:5,np:1});sfx('swoosh')}},

chakram:{n:'Razor Chakram',cl:'rogue',sl:'w',d:'Throw your blade instead of slashing. It cuts on the way out and again coming back',stat(s){s.fr*=0.45},atk(m){bolt(itang(m),780,3,S.atk*1.1,{el:'phys',look:'knife',r:13,pierce:999,np:1,basic:1,bk:0.42,tk:(b,dt)=>{if(b.bk>0){b.bk-=dt;if(b.bk<=0)b.hit=new Set();return}const t=Math.atan2(P.y-b.y,P.x-b.x);b.vx=Math.cos(t)*860;b.vy=Math.sin(t)*860;if(Math.hypot(P.x-b.x,P.y-b.y)<26)b.dead=1}});sfx('swoosh');return true}},

hemorrhage:{n:'Hemorrhage',cl:'rogue',sl:'a',cd:8,el:'blood',d:'Everything poisoned near you takes all its remaining poison at once, doubled',act(){let n=0;for(const e of itn(P.x,P.y,380)){if(!(e.st.pt>0)||!e.st.pd)continue;const v=e.st.pd*e.st.pt*2*2;e.st.pt=0;e.st.pd=0;ring(e.x,e.y,8,70,'#ff4d6d',0.25);itx(e,v,'blood');n++}ring(P.x,P.y,10,380,'#ff4d6d',0.3);sfx(n?'crit':'no');return true}},
chainblade:{n:'Chainblade',cl:'rogue',sl:'a',cd:7,el:'phys',d:'Throw a blade at the foe near your cursor. It leaps 6 times for 160% and gives Edge each leap',act(r,m){const t=itn(m.x,m.y,300)[0];if(!t){sfx('no');return false}itx(t,S.atk*1.6,'phys');edge(1);fx.push({k:'beam',x0:P.x,y0:P.y,x1:t.x,y1:t.y,c:'#d8ccff',l:0,m:0.15});itarc(t,6,S.atk*1.6,'#d8ccff','phys',()=>edge(1));return true}},
vanish:{n:'Vanish',cl:'rogue',sl:'a',cd:14,el:'shadow',d:'Nothing can touch you for 3s, and your next slash hits 4x',act(){P.inv=3;itp().van=1;burst(P.x,P.y,26,'#5b3fa8',220);txt(P.x,P.y-36,'VANISHED','#a58bf0',18,true);sfx('blink');return true},bf(){return itp().van?{n:'Vanished',c:'#a58bf0',i:'dagger',v:1}:null},m(e,o){return itp().van&&isb(o)?4:1},hit(e,d,c,o){if(isb(o))itp().van=0}},

sunhammer:{n:'Sunhammer Censer',cl:'priest',sl:'w',d:'-30% bolt damage. Bolts burst on impact for 70% in an area',atk(m){hl(itang(m),S.atk*0.7,{oh:b=>{const x=b.x,y=b.y;later(0.01,()=>explode(x,y,95,S.atk*0.7,'holy'))}});sfx('shoot');return true}},

martyrex:{n:'Martyr Exchange',cl:'priest',sl:'a',cd:15,el:'blood',d:'Burn 20% of your health. For 5s your healing doubles and you deal 40% more',act(){const I=itp();P.hp=Math.max(1,P.hp-S.mhp*0.2);I.mx=run.t+5;ring(P.x,P.y,10,120,'#ff4d6d',0.3);sfx('hurt');return true},bf(){const v=(itp().mx||0)-run.t;return v>0?{n:'Exchange',c:'#ff4d6d',i:'drop',v:v/5,t:v}:null},m(){return itp().mx>run.t?1.4:1},hm(){return itp().mx>run.t?2:1}},
halo:{n:'Halo of Three',cl:'priest',sl:'a',cd:12,el:'holy',d:'3 halos circle you for 10s. Each one stops a hit and bursts for 200%',act(){itp().ha={n:3,t:run.t+10};ring(P.x,P.y,10,70,'#ffe9a8',0.3);sfx('fuse');return true},bf(){const h=itp().ha;return h&&h.n>0&&h.t>run.t?{n:'Halo x'+h.n,c:'#ffe9a8',i:'cross',v:(h.t-run.t)/10,t:h.t-run.t}:null},g(){const h=itp().ha;if(!h||h.n<1||h.t<run.t)return false;h.n--;P.inv=0.25;txt(P.x,P.y-24,'HALO','#ffe9a8',15,true);explode(P.x,P.y,140,S.atk*2,'holy');return true}},
